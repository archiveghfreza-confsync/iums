<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به ویزیت هوشمند آفلاین - هوش‌طب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }

        .login-header h2 {
            color: #1a1a2e;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        .captcha-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 5px;
            border: 2px solid #e0e0e0;
        }

        .captcha-text {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            letter-spacing: 8px;
            color: #2d3436;
            background: white;
            padding: 5px 15px;
            border-radius: 8px;
            user-select: none;
            min-width: 120px;
            text-align: center;
        }

        .captcha-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .captcha-actions button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .captcha-actions button:hover {
            background: #5a6fd6;
            transform: scale(1.05);
        }

        .captcha-input {
            margin-top: 10px;
        }

        .captcha-input input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #f8f9fa;
        }

        .captcha-input input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .captcha-input input.error {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-family: inherit;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-login i {
            margin-left: 8px;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            text-align: center;
            padding: 10px;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid #fcc;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #27ae60;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            text-align: center;
            padding: 10px;
            background: #f0fff4;
            border-radius: 8px;
            border: 1px solid #b2dfdb;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #333;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
                margin: 15px;
            }

            .captcha-text {
                font-size: 22px;
                letter-spacing: 5px;
                min-width: 90px;
            }

            .login-header h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <button class="close-btn" onclick="closeLogin()" style="display:none">✕</button>
        
        <div class="login-header">
            <img src="assets/logoenter.png" alt="هوش‌طب" />
            <h2>ورود به ویزیت هوشمند آفلاین</h2>
            <p>لطفاً اطلاعات خود را وارد کنید</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید" required autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password">کلمه عبور</label>
                <input type="password" id="password" placeholder="کلمه عبور خود را وارد کنید" required autocomplete="current-password" />
            </div>

            <div class="form-group">
                <label>کد امنیتی (کپچا)</label>
                <div class="captcha-container">
                    <span class="captcha-text" id="captchaText"></span>
                    <div class="captcha-actions">
                        <button type="button" onclick="generateCaptcha()" title="تولید کد جدید">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button type="button" onclick="speakCaptcha()" title="گوش دادن به کد">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>
                </div>
                <div class="captcha-input">
                    <input type="text" id="captchaInput" placeholder="کد امنیتی را وارد کنید" required autocomplete="off" />
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>ورود به ویزیت هوشمند</span>
            </button>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </form>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script>
        // ============================================================
        // تنظیمات
        // ============================================================
        var GAS_URL = 'https://hooshteb-api.ghfreza.workers.dev/api/doctorslogin'
        
        const SESSION_KEY = 'hooshteb_offline_session';
        const DOCTOR_NAME_KEY = 'doctor_name';
        const DOCTOR_DATA_KEY = 'doctor_data';

        // ============================================================
        // تولید کپچا
        // ============================================================
        let currentCaptcha = '';


        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = captcha;
            document.getElementById('captchaText').textContent = captcha;
            document.getElementById('captchaInput').value = '';
            document.getElementById('captchaInput').classList.remove('error');
        }

        function speakCaptcha() {
            if (!currentCaptcha) {
                generateCaptcha();
            }
            const utterance = new SpeechSynthesisUtterance(currentCaptcha.split('').join(' '));
            utterance.lang = 'fa-IR';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }

        // ============================================================
        // نمایش پیام‌ها
        // ============================================================
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        // ============================================================
        // بررسی نشست قبلی
        // ============================================================
        function checkExistingSession() {
            try {
                const session = localStorage.getItem(SESSION_KEY);
                if (session) {
                    const data = JSON.parse(session);
                    if (data.username && data.timestamp) {
                        const now = Date.now();
                        const sessionAge = now - data.timestamp;
                        // نشست به مدت 8 ساعت معتبر است
                        if (sessionAge < 8 * 60 * 60 * 1000) {
                            return data;
                        } else {
                            localStorage.removeItem(SESSION_KEY);
                            localStorage.removeItem(DOCTOR_NAME_KEY);
                            localStorage.removeItem(DOCTOR_DATA_KEY);
                        }
                    }
                }
            } catch (e) {
                console.error('Error checking session:', e);
            }
            return null;
        }

        // ===== تابع باز کردن داشبورد =====
        function openDoctorDashboard(uid) {
            // بستن مودال
            if (window.parent && window.parent !== window) {
                window.parent.postMessage('closeLogin', '*');
            }

            // هدایت به داشبورد
            setTimeout(() => {
                window.location.href = `doctor-dashboard.html?uid=${uid}`;
            }, 500);
        }
        // ============================================================
        // ✅ تابع اصلی ورود به سیستم
        // ============================================================
        async function handleLogin(event) {

            event.preventDefault();

            //--------------------------------------------------------
            // دریافت اطلاعات فرم
            //--------------------------------------------------------
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const captchaInput = document.getElementById('captchaInput').value.trim();

            const loginBtn = document.getElementById('loginBtn');

            hideMessages();

            //--------------------------------------------------------
            // بررسی کپچا
            //--------------------------------------------------------
            if (captchaInput !== currentCaptcha) {

                showError('❌ کد امنیتی اشتباه است.');

                document.getElementById('captchaInput').classList.add('error');

                generateCaptcha();

                return;
            }

            //--------------------------------------------------------
            // بررسی ورود اطلاعات
            //--------------------------------------------------------
            if (!username || !password) {

                showError('❌ لطفاً نام کاربری و کلمه عبور را وارد کنید.');

                if (!username)
                    document.getElementById('username').classList.add('error');

                if (!password)
                    document.getElementById('password').classList.add('error');

                return;
            }

            //--------------------------------------------------------
            // نمایش وضعیت
            //--------------------------------------------------------
            loginBtn.disabled = true;
            loginBtn.innerHTML =
                '<span class="loading-spinner"></span> در حال بررسی اطلاعات...';

            //--------------------------------------------------------
            // ارسال درخواست
            //--------------------------------------------------------
            const params = new URLSearchParams();
            params.append("username", username);
            params.append("password", password);
            await fetch(GAS_URL, {
                method: "POST",
                body: params
            })
                .then(response => {

                    if (!response.ok) {
                        throw new Error("🌐 اینترنت وصل نیست یا سرعت آن کم است. 🔄 مجدداً تلاش کنید");
                    }

                    return response.json();

                })

                .then(data => {

                    console.log("پاسخ سرور :", data);

                    //----------------------------------------------------
                    // ورود موفق
                    //----------------------------------------------------
                    if (data.success) {

                        const doctor = data.doctor;

                        console.log("نام پزشک :", doctor.fullname);
                        console.log("UID :", doctor.uid);
                        console.log("پزشک ID :", doctor.pezeshk_id);

                        // ذخیره Session
                        localStorage.setItem("SESSION_TOKEN", data.token);

                        localStorage.setItem(SESSION_KEY, JSON.stringify({

                            token: data.token,
                            uid: doctor.uid,
                            username: doctor.username,
                            loginTime: Date.now()

                        }));

                        // ذخیره اطلاعات پزشک
                        localStorage.setItem(
                            DOCTOR_NAME_KEY,
                            doctor.fullname
                        );

                        localStorage.setItem(
                            DOCTOR_DATA_KEY,
                            JSON.stringify(doctor)
                        );

                        showSuccess(
                            `✅ خوش آمدید ${doctor.fullname}`
                        );

                        setTimeout(function () {

                            // به صفحه اصلی بگو Modal را ببندد
                            /*
                            window.parent.postMessage({
                                action: "closeLoginModal"
                            }, window.location.origin);

                            openDoctorDashboard(doctor.uid);
                            */
                            window.parent.postMessage({

                                action: "loginSuccess",
                                uid: doctor.uid,
                                username: doctor.username

                            }, "*");


                        }, 2000);

                        return;
                    }

                    //----------------------------------------------------
                    // ورود ناموفق
                    //----------------------------------------------------
                    showError("❌ " + data.message);

                    document.getElementById("username").classList.add("error");
                    document.getElementById("password").classList.add("error");

                })

                .catch(error => {

                    console.error(error);

                    showError("🌐 اینترنت وصل نیست یا سرعت آن کم است. 🔄 مجدداً تلاش کنید");

                })

                .finally(() => {

                    loginBtn.disabled = false;

                    loginBtn.innerHTML =
                        '<i class="fas fa-sign-in-alt"></i> <span>ورود به ویزیت هوشمند</span>';

                });

        }        

        // ============================================================
        // باز کردن داشبورد پزشک
        // ============================================================
        function openDoctorDashboard(username) {
            // بستن پنجره لاگین
            window.close();
            
            // باز کردن صفحه پزشک در پنجره جدید
            const doctorPage = window.open('', '_blank');
            if (doctorPage) {
                const doctorName = localStorage.getItem(DOCTOR_NAME_KEY) || 'پزشک گرامی';
                const doctorData = localStorage.getItem(DOCTOR_DATA_KEY) || '{}';
                
                doctorPage.document.write(`
                    <!DOCTYPE html>

                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
                        <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
                        <style>
                            * {
                                margin: 0;
                                padding: 0;
                                box-sizing: border-box;
                            }
                            body {
                                font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                                display: flex;
                                justify-content: center;
                                align-items: center;
                                min-height: 100vh;
                                direction: rtl;
                                margin: 0;
                                padding: 20px;
                            }
                            .dashboard {
                                background: white;
                                border-radius: 20px;
                                padding: 50px 40px;
                                max-width: 600px;
                                width: 100%;
                                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                                text-align: center;
                                animation: fadeIn 0.6s ease-out;
                            }
                            @keyframes fadeIn {
                                from { opacity: 0; transform: scale(0.9); }
                                to { opacity: 1; transform: scale(1); }
                            }
                            .dashboard img {
                                width: 80px;
                                height: 80px;
                                margin-bottom: 20px;
                            }
                            .dashboard h1 {
                                color: #1a1a2e;
                                font-size: 28px;
                                font-weight: 800;
                                margin-bottom: 15px;
                            }
                            .dashboard .doctor-name {
                                color: #667eea;
                                font-size: 22px;
                                font-weight: 700;
                                margin: 10px 0;
                            }
                            .dashboard .welcome-text {
                                color: #555;
                                font-size: 16px;
                                line-height: 1.8;
                                margin: 20px 0 30px;
                            }
                            .dashboard .features {
                                display: grid;
                                grid-template-columns: 1fr 1fr;
                                gap: 15px;

                            }
                            .dashboard .feature-item {
                                background: #f8f9fa;

                                border-radius: 12px;
                                border: 2px solid #e0e0e0;
                                transition: all 0.3s ease;
                            }
                            .dashboard .feature-item:hover {
                                border-color: #667eea;
                                transform: translateY(-3px);
                                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
                            }
                            .dashboard .feature-item i {
                                color: #667eea;
                                font-size: 24px;
                                margin-bottom: 8px;
                                display: block;
                            }
                            .dashboard .feature-item span {
                                font-size: 14px;
                                color: #333;
                                font-weight: 500;
                            }
                            .dashboard .logout-btn {
                                background: #e74c3c;
                                color: white;
                                border: none;
                                padding: 12px 30px;
                                border-radius: 10px;

                                cursor: pointer;
                                transition: all 0.3s ease;
                                margin-top: 20px;
                                font-family: inherit;
                            }
                            .dashboard .logout-btn:hover {
                                background: #c0392b;
                                transform: translateY(-2px);
                                box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
                            }
                            .dashboard .status-badge {
                                display: inline-block;
                                background: #27ae60;
                                color: white;
                                padding: 5px 20px;
                                border-radius: 20px;
                                font-size: 13px;
                                font-weight: 600;
                                margin-top: 10px;
                            }
                            .dashboard .doctor-info {
                                background: #f0f4ff;
                                padding: 15px;
                                border-radius: 12px;
                                margin: 15px 0;
                                text-align: right;
                            }
                            .dashboard .doctor-info p {
                                margin: 5px 0;
                                font-size: 14px;
                                color: #333;
                            }
                            .dashboard .doctor-info strong {
                                color: #667eea;
                            }
                            @media (max-width: 480px) {
                                .dashboard {
                                    padding: 30px 20px;
                                }
                                .dashboard .features {
                                    grid-template-columns: 1fr;
                                }
                                .dashboard h1 {
                                    font-size: 22px;
                                }
                            }
                        </style>
                    </head>
                    <body>
                        <div class="dashboard">
                            <img src="assets/logoenter.png" alt="هوش‌طب" />
                            <h1>🩺 خوش آمدید</h1>
                            <div class="doctor-name">${doctorName}</div>
                            <div class="status-badge">✓ آنلاین</div>
                            
                            <div class="doctor-info">
                                <p><strong>👤 نام کاربری:</strong> ${username}</p>
                                <p><strong>🆔 شماره نظام پزشکی:</strong> ${JSON.parse(doctorData).pezeshk_id || '---'}</p>
                            </div>
                            
                            <div class="welcome-text">
                                به سامانه <strong>ویزیت هوشمند آفلاین</strong> خوش آمدید.<br />
                                سیستم آماده ارائه خدمات به بیماران شماست.
                            </div>
                            <div class="features">
                                <div class="feature-item">
                                    <i class="fas fa-users"></i>
                                    <span>مدیریت بیماران</span>

                                <div class="feature-item">
                                    <i class="fas fa-calendar-check"></i>

                                <div class="feature-item">
                                    <i class="fas fa-file-medical"></i>
                                    <span>پرونده الکترونیک</span>
                                </div>
                                <div class="feature-item">
                                    <i class="fas fa-chart-line"></i>

                                </div>
                            </div>
                            <button class="logout-btn" onclick="logoutAndClose()">
                                <i class="fas fa-sign-out-alt"></i> خروج از سیستم

                        </div>

                        <script>
                            function logoutAndClose() {
                                localStorage.removeItem('${SESSION_KEY}');
                                localStorage.removeItem('${DOCTOR_NAME_KEY}');
                                localStorage.removeItem('${DOCTOR_DATA_KEY}');
                                window.close();
                            }

                            // جلوگیری از دسترسی مستقیم با آدرس
                            if (!localStorage.getItem('${SESSION_KEY}')) {
                                document.body.innerHTML = '<div style="text-align:center;padding:50px;color:white;"><h1>⚠️ دسترسی غیرمجاز</h1><p>لطفاً از طریق صفحه اصلی وارد شوید.</p></div>';
                            }
                        <\/script>
                    </body>
                    </html>
                `);
            }
        }

        // ============================================================
        // بستن پنجره لاگین
        // ============================================================
        function closeLogin() {
            // اگر در iframe هستید
            if (window.parent && window.parent !== window) {
                // به والد پیام بدهید
                window.parent.postMessage('closeLogin', '*');
            } else {
                // اگر خودش پنجره مستقل است
                window.close();
            }
        }

        // ============================================================
        // مقداردهی اولیه
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // تولید کپچا
            generateCaptcha();

            // بررسی نشست قبلی
            const session = checkExistingSession();
            if (session) {
                document.getElementById('username').value = session.username;
                // اگر نشست معتبر وجود دارد، می‌توانیم پیام بدهیم
                console.log('نشست قبلی یافت شد:', session.username);
            }

            // حذف کلاس خطا هنگام تایپ
            document.getElementById('username').addEventListener('input', function() {
                this.classList.remove('error');
                hideMessages();
            });
            document.getElementById('password').addEventListener('input', function() {
                this.classList.remove('error');
                hideMessages();
            });
            document.getElementById('captchaInput').addEventListener('input', function() {
                this.classList.remove('error');
                hideMessages();
            });

            // گوش دادن به کلید Enter در فیلد کپچا
            document.getElementById('captchaInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });
        });

    </script>
</body>
</html>
